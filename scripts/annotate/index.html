<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BadmintonStudio · 回合标注</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#121722; --panel2:#171d2b; --line:#26304a;
    --txt:#e6eaf2; --dim:#8b96ad; --auto:#4b5563; --ann:#22c55e; --sel:#facc15;
    --pend:#fb923c; --play:#f43f5e; --accent:#38bdf8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:13px/1.45 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  header{display:flex;gap:16px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .title{font-weight:600}
  header .meta{color:var(--dim);font-size:12px}
  header .grow{flex:1}
  #saveState{font-size:12px;color:var(--dim)}
  #saveState.dirty{color:var(--pend)}
  #saveState.ok{color:var(--ann)}
  main{display:grid;grid-template-columns:1fr 340px;height:calc(100% - 41px)}
  .left{display:flex;flex-direction:column;min-width:0}
  .video-wrap{position:relative;background:#000;flex:0 0 auto;display:flex;justify-content:center}
  video{width:100%;max-height:46vh;background:#000;outline:none}
  .hud{position:absolute;left:10px;top:8px;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums;font-size:12px}
  .hud b{color:var(--accent);font-weight:600}
  .controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:#1d4ed8;border-color:#1d4ed8}
  button.danger:hover{border-color:var(--play);color:#fff}
  button.on{background:#14532d;border-color:var(--ann)}
  .spacer{flex:1}
  .ctrl-hint{color:var(--dim);font-size:11px}
  .tl-overview{padding:8px 12px 0;position:relative}
  #ov{width:100%;height:56px;display:block;border:1px solid var(--line);border-radius:6px;cursor:crosshair;touch-action:none}
  .tl-detail{position:relative;margin:8px 12px 4px;height:104px;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden;user-select:none;touch-action:none}
  .detail-ruler{position:absolute;left:0;right:0;top:0;height:20px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .tick{position:absolute;top:0;bottom:0;border-left:1px solid #2b3552;color:var(--dim);font-size:10px;padding-left:3px;font-variant-numeric:tabular-nums}
  .track{position:absolute;left:0;right:0;top:20px;bottom:0}
  .bar{position:absolute;top:8px;height:34px;border-radius:5px;background:var(--auto);opacity:.55}
  .bar.ann{top:8px;height:34px;background:var(--ann);opacity:.35;border:1px solid #16a34a}
  .bar.ann.sel{opacity:.85;border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
  .bar.pend{background:transparent;border:2px dashed var(--pend);opacity:.9}
  .handle{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;border-radius:3px}
  .bar.ann .handle{background:rgba(250,204,21,.0)}
  .bar.ann.sel .handle{background:rgba(250,204,21,.55)}
  .bar .lbl{position:absolute;left:6px;right:6px;top:1px;font-size:10px;color:#eaffea;white-space:nowrap;overflow:hidden;pointer-events:none;text-shadow:0 1px 2px #000}
  #playhead{position:absolute;top:20px;bottom:0;width:2px;background:var(--play);pointer-events:none;z-index:5}
  #playhead::before{content:"";position:absolute;top:-3px;left:-4px;width:10px;height:8px;background:var(--play);clip-path:polygon(0 0,100% 0,50% 100%)}
  .hints{padding:4px 14px 10px;color:var(--dim);font-size:11px;line-height:1.7}
  kbd{background:#0d1320;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-family:inherit;color:var(--txt)}
  aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .focusbox{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .focusbox input{width:72px;background:#0d1320;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-variant-numeric:tabular-nums}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--dim);padding:8px}
  .tabs button.active{color:#fff;border-bottom:2px solid var(--accent);background:var(--panel2)}
  .list{overflow:auto;flex:1}
  .row{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid #1b2233;cursor:pointer}
  .row:hover{background:#1a2133}
  .row.sel{background:#20304a}
  .row .idx{color:var(--dim);font-size:11px}
  .row .times{font-variant-numeric:tabular-nums;font-size:12px}
  .row .times small{color:var(--dim)}
  .row .tags{color:var(--dim);font-size:10px}
  .row .x{color:var(--dim);border:0;background:transparent;padding:2px 6px}
  .row .x:hover{color:var(--play)}
  .empty{padding:20px;color:var(--dim);text-align:center}
  .legend{display:flex;gap:12px;padding:4px 12px 0;color:var(--dim);font-size:11px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
</style>
</head>
<body>
<!--BANNER-->
<header>
  <span class="title">🏸 回合标注</span>
  <span class="meta" id="hMeta">加载中…</span>
  <span class="grow"></span>
  <span id="saveState">—</span>
</header>
<main>
  <section class="left">
    <div class="video-wrap">
      <video id="v" preload="auto" src="/api/video" playsinline></video>
      <div class="hud" id="hud">00:00.000 / 00:00.000</div>
    </div>
    <div class="controls">
      <button id="bPlay" class="primary">▶ 播放 (Space)</button>
      <button id="bBack1">« -1s (←)</button>
      <button id="bFwd1">+1s (→) »</button>
      <button id="bBack01">-0.1s</button>
      <button id="bFwd01">+0.1s</button>
      <span class="spacer"></span>
      <label class="ctrl-hint">速度 <input id="speed" type="range" min="0.1" max="2" step="0.1" value="1" style="width:80px;vertical-align:middle"><span id="speedVal">1.0x</span></label>
      <button id="bLoop">循环选中</button>
      <button id="bIn">[ 新回合起点</button>
      <button id="bOut">] 新回合终点</button>
      <button id="bAccept">c 确认自动回合</button>
      <button id="bNextAuto">n 下一自动回合</button>
      <button id="bPrevAuto">p 上一自动回合</button>
      <button id="bDel" class="danger">d 删除选中</button>
      <button id="bUndo">z 撤销</button>
      <span class="spacer"></span>
      <button id="bSeed">全部采用自动</button>
      <button id="bClear" class="danger">清空</button>
      <button id="bSave" class="primary">保存 (s)</button>
      <button id="bCsv">导出 CSV</button>
    </div>
    <div class="tl-overview"><canvas id="ov"></canvas></div>
    <div class="legend">
      <span><span class="sw" style="background:var(--auto)"></span>自动切分（草稿）</span>
      <span><span class="sw" style="background:var(--ann)"></span>我的标注</span>
      <span><span class="sw" style="background:var(--sel)"></span>选中</span>
      <span><span class="sw" style="background:var(--pend)"></span>正在标记</span>
      <span class="spacer" style="flex:1"></span>
      <button id="bZoomOut">缩小</button><button id="bZoomIn">放大</button>
    </div>
    <div class="tl-detail" id="detail">
      <div class="detail-ruler" id="ruler"></div>
      <div class="track" id="track"></div>
      <div id="playhead"></div>
    </div>
    <div class="hints">
      <kbd>Space</kbd> 播放/暂停 · <kbd>← →</kbd> ±1s（<kbd>Shift</kbd> ±0.1s / <kbd>Alt</kbd> ±5s） ·
      <kbd>[</kbd> 新回合起点 · <kbd>]</kbd> 新回合终点 · <kbd>{</kbd>/<kbd>}</kbd> 设置选中回合的起点/终点 · <kbd>c</kbd> 确认自动回合并跳下一个 ·
      <kbd>n</kbd>/<kbd>p</kbd> 下一/上一自动回合 · <kbd>PgDn</kbd>/<kbd>PgUp</kbd> 下一/上一 5 分钟段 ·
      <kbd>, .</kbd> 选中起点 ∓0.1s · <kbd>&lt; &gt;</kbd> 选中终点 ∓0.1s ·
      <kbd>d</kbd> 删除 · <kbd>z</kbd> 撤销 · <kbd>s</kbd> 保存 · 时间轴上拖动绿条边缘可微调
    </div>
  </section>
  <aside>
    <div class="focusbox">
      <span class="ctrl-hint">聚焦窗口</span>
      <input id="fStart" type="number" step="1" min="0" />
      <span>–</span>
      <input id="fEnd" type="number" step="1" min="0" />
      <button id="bFocus">聚焦</button>
      <button id="bAll">全长</button>
    </div>
    <div class="focusbox">
      <button id="bPrevSeg">‹ 上一段 (PgUp)</button>
      <button id="bNextSeg">下一段 › (PgDn)</button>
      <label class="ctrl-hint">段长 <input id="segLen" type="number" min="10" step="60" value="300" />s</label>
    </div>
    <div class="tabs">
      <button id="tabAuto" class="active">自动回合 (<span id="nAuto">0</span>)</button>
      <button id="tabAnn">我的标注 (<span id="nAnn">0</span>)</button>
    </div>
    <div class="list" id="list"></div>
  </aside>
</main>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const v = $("#v");
const ov = $("#ov"), octx = ov.getContext("2d");
const track = $("#track"), ruler = $("#ruler"), playhead = $("#playhead"), detail = $("#detail");
const S = {
  duration: 0, fps: 0,
  auto: [], ann: [], focus: [0, 0],
  sel: null, pending: null, undo: [],
  viewCenter: 0, viewSpan: 30, loop: false, tab: "auto",
  note: "", dirty: false, saveTimer: null,
};
let idSeq = 1;
const nextId = () => idSeq++;

const fmt = (t) => {
  t = Math.max(0, t || 0);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), ms = Math.round((t - Math.floor(t)) * 1000);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms).padStart(3,"0")}`;
};
const fmtShort = (t) => { t = Math.max(0, t||0); const m=Math.floor(t/60), s=t%60; return `${m}:${s.toFixed(1).padStart(4,"0")}`; };
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const overlap = (r, a) => Math.max(0, Math.min(r.end, a.end) - Math.max(r.start, a.start));

function sortAnn(){ S.ann.sort((a,b)=>a.start-b.start); }
function findAnn(id){ return S.ann.find(r=>r.id===id) || null; }
function selAnn(){ return findAnn(S.sel); }

function pushUndo(){
  S.undo.push(JSON.parse(JSON.stringify(S.ann.map(({id,...r})=>r))));
  if (S.undo.length > 100) S.undo.shift();
}
function undo(){
  if (!S.undo.length) return;
  const snap = S.undo.pop();
  S.ann = snap.map(r => ({...r, id: nextId()}));
  S.sel = null; markDirty(); renderAll();
}

function markDirty(){
  S.dirty = true; setSave("未保存…", "dirty");
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(save, 1200);
}
async function save(){
  try{
    const res = await fetch("/api/save", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({rallies:S.ann, focus:S.focus, note:S.note})
    });
    const j = await res.json();
    S.dirty = false; setSave(`已保存 · ${j.count} 回合`, "ok");
  }catch(e){ setSave("保存失败", "dirty"); }
}
function setSave(t, cls){ const el=$("#saveState"); el.textContent=t; el.className=cls||""; }

// 直接从当前内存状态导出 CSV（不依赖磁盘上是否已保存），并做标准 CSV 转义。
function exportCsv(){
  const fps = S.fps || 0;
  const q = (s) => '"' + String(s ?? "").replace(/"/g, '""') + '"';
  const lines = ["index,start,end,duration,start_frame,end_frame,source,note"];
  S.ann.slice().sort((a,b)=>a.start-b.start).forEach((r,i)=>{
    const sf = fps ? Math.round(r.start*fps) : "";
    const ef = fps ? Math.round(r.end*fps) : "";
    lines.push([i+1, r.start.toFixed(3), r.end.toFixed(3), (r.end-r.start).toFixed(3), sf, ef, q(r.source), q(r.note)].join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "rally_annotations.csv";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

// ---------------------------------------------------------------- 播放控制
function seek(t, pause=true){ v.currentTime = clamp(t, 0, Math.max(0,S.duration-0.01)); S.viewCenter = v.currentTime; if(pause) v.pause(); }
function step(dt){ seek(v.currentTime + dt); }
function togglePlay(){ if(v.paused) v.play(); else v.pause(); }
function nudge(dt){ const r=selAnn(); if(!r) return; pushUndo(); r.start=clamp(r.start+dt,0,r.end-0.05); r.start=Math.max(0,r.start); S.viewCenter=r.start; markDirty(); renderAll(); }
function nudgeEnd(dt){ const r=selAnn(); if(!r) return; pushUndo(); r.end=clamp(r.end+dt,r.start+0.05,S.duration); markDirty(); renderAll(); }

// ---------------------------------------------------------------- 标注操作
function addAnn(r, select=true){
  const obj = { start:r.start, end:r.end, source:r.source||"manual", note:r.note||"", id:nextId() };
  S.ann.push(obj); sortAnn(); if(select) S.sel=obj.id; markDirty(); renderAll(); return obj;
}
// 新建回合：`[` 永远开始一条新回合，绝不动已选中的旧回合。
function newSeg(){
  S.pending = { start:v.currentTime, end:v.currentTime, id:nextId() };
  S.sel = null; S.viewCenter = v.currentTime; renderAll();
}
function finishSeg(){
  if (!S.pending) return;
  const t = v.currentTime;
  const st = Math.min(S.pending.start, t), en = Math.max(S.pending.start, t);
  S.pending = null;
  if (en - st >= 0.05){ pushUndo(); addAnn({start:st,end:en,source:"manual"}, true); }
  renderAll();
}
// 微调「选中」回合的边界（默认不动选中项，需显式用 { } 或拖动）。
function setSelStart(){ const r=selAnn(); if(!r) return; pushUndo(); r.start=clamp(v.currentTime,0,r.end-0.05); S.viewCenter=r.start; markDirty(); renderAll(); }
function setSelEnd(){ const r=selAnn(); if(!r) return; pushUndo(); r.end=clamp(v.currentTime,r.start+0.05,S.duration); markDirty(); renderAll(); }
function delSel(){
  const r = selAnn(); if(!r) return;
  pushUndo(); S.ann = S.ann.filter(x=>x.id!==r.id); S.sel=null; markDirty(); renderAll();
}
function clearAll(){
  if (!S.ann.length) return;
  if (!confirm(`确定清空全部 ${S.ann.length} 条标注？`)) return;
  pushUndo(); S.ann=[]; S.sel=null; markDirty(); renderAll();
}
function seedAll(){
  if (!S.auto.length) return alert("没有自动切分结果可导入");
  if (S.ann.length && !confirm("将把自动回合追加到现有标注，继续？")) return;
  pushUndo();
  for (const a of S.auto) S.ann.push({start:a.start,end:a.end,source:"auto",note:"",id:nextId()});
  sortAnn(); markDirty(); renderAll();
}
function currentAuto(){
  const t=v.currentTime;
  return S.auto.find(r=> t>=r.start-0.3 && t<=r.end+0.3)
      || S.auto.find(r=> r.start>t) || null;
}
function acceptAuto(advance=true){
  const a = currentAuto(); if(!a) return;
  const ex = S.ann.find(x=>overlap(x,a) >= 0.5*Math.min(a.end-a.start, x.end-x.start));
  let obj;
  if (ex){ obj=ex; S.sel=ex.id; }
  else { pushUndo(); obj=addAnn({start:a.start,end:a.end,source:"auto"}, true); }
  if (advance){
    const nxt = S.auto.find(r=> r.start > obj.end - 0.2);
    if (nxt) seek(nxt.start, true); else seek(obj.end, true);
    v.pause();
  } else { S.viewCenter=a.start; }
  renderAll();
}
function jumpAuto(dir){
  const t=v.currentTime;
  let tgt=null;
  if (dir>0) tgt = S.auto.find(r=>r.start > t+0.01);
  else tgt = [...S.auto].reverse().find(r=>r.start < t-0.01);
  if(!tgt) return;
  seek(tgt.start, true); if(dir>0) v.play();
}
function selectNearest(){
  const t=v.currentTime;
  let best=null,bd=1e9;
  for(const r of S.ann){ const d = (t>=r.start&&t<=r.end)?0:Math.min(Math.abs(t-r.start),Math.abs(t-r.end)); if(d<bd){bd=d;best=r;} }
  if(best){ S.sel=best.id; S.viewCenter=best.start; renderAll(); }
}

// 「段」导航：按固定段长（默认 300s）推进整段视频。标注文件是整片的，
// 换段只是换聚焦窗口，不会丢已标注的内容。
function goSeg(dir){
  const dur = S.duration || 0;
  const len = clamp(parseFloat($("#segLen").value)||300, 10, Math.max(10, dur||300));
  const n = Math.max(1, Math.ceil(dur/len));
  const idx = clamp(Math.round(S.focus[0]/len) + dir, 0, n-1);
  const a = idx*len, b = Math.min(dur || (idx+1)*len, a+len);
  S.focus = [a, b]; S.viewSpan = Math.max(4, b-a);
  $("#fStart").value = Math.round(a); $("#fEnd").value = Math.round(b);
  seek(a, true); markDirty(); renderAll();
}

// ---------------------------------------------------------------- 渲染
function resizeCanvases(){
  const w = ov.clientWidth, h = 56, dpr = window.devicePixelRatio||1;
  ov.width = w*dpr; ov.height = h*dpr; octx.setTransform(dpr,0,0,dpr,0,0);
}
function detailGeom(){
  const W = track.clientWidth || detail.clientWidth;
  let span = clamp(S.viewSpan, 1, Math.max(2, S.duration||2));
  let start = clamp(S.viewCenter - span/2, 0, Math.max(0, S.duration - span));
  return {W, span, start, end:start+span};
}
function t2x(t,g){ return (t-g.start)/g.span*g.W; }

function renderOverview(){
  const w = ov.clientWidth, h = 56;
  octx.clearRect(0,0,w,h);
  const dur = S.duration||1;
  const X = (t)=>t/dur*w;
  // grid
  octx.strokeStyle="#1c2438"; octx.lineWidth=1;
  for(let s=0;s<=dur;s+=(dur>1200?300:(dur>600?120:60))){ const x=X(s); octx.beginPath(); octx.moveTo(x,0); octx.lineTo(x,h); octx.stroke(); }
  // focus window
  const [f0,f1]=S.focus;
  if (f1>f0){ octx.fillStyle="rgba(56,189,248,.08)"; octx.fillRect(X(f0),0,X(f1)-X(f0),h); }
  // auto
  octx.fillStyle="#4b5563";
  for(const r of S.auto){ const x=X(r.start), ww=Math.max(1,X(r.end)-x); octx.globalAlpha=.55; octx.fillRect(x,34,ww,16); }
  octx.globalAlpha=1;
  // ann
  for(const r of S.ann){ const x=X(r.start), ww=Math.max(1,X(r.end)-x); octx.fillStyle = (r.id===S.sel)?"#facc15":"#22c55e"; octx.globalAlpha=(r.id===S.sel)?.95:.7; octx.fillRect(x,16,ww,16); }
  octx.globalAlpha=1;
  if (S.pending){ const x=X(S.pending.start), ww=Math.max(1,X(Math.max(S.pending.end,v.currentTime))-x); octx.fillStyle="#fb923c"; octx.fillRect(x,16,ww,16); }
  // playhead
  octx.fillStyle="#f43f5e"; octx.fillRect(X(v.currentTime)-1,0,2,h);
}

function niceStep(span){
  const raw = span/8; const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1,2,5,10]) if (raw <= m*pow) return m*pow;
  return 10*pow;
}
function renderDetail(){
  const g = detailGeom();
  ruler.innerHTML = "";
  const step = niceStep(g.span);
  for (let t=Math.ceil(g.start/step)*step; t<=g.end; t+=step){
    const d=document.createElement("div"); d.className="tick"; d.style.left=t2x(t,g)+"px"; d.textContent=fmtShort(t);
    ruler.appendChild(d);
  }
  track.innerHTML = "";
  const mk = (cls, r, label, id) => {
    const x1=t2x(r.start,g), x2=t2x(r.end,g);
    if (x2 < -20 || x1 > g.W+20) return null;
    const b=document.createElement("div"); b.className=cls;
    b.style.left=Math.max(-2,x1)+"px"; b.style.width=Math.max(2,x2-x1)+"px";
    if (label!=null) b.innerHTML=`<div class="lbl">${label}</div>`;
    if (id!=null){ b.dataset.id=id;
      const h1=document.createElement("div"); h1.className="handle"; h1.style.left="0"; h1.dataset.edge="start"; b.appendChild(h1);
      const h2=document.createElement("div"); h2.className="handle"; h2.style.right="0"; h2.dataset.edge="end"; b.appendChild(h2);
    }
    track.appendChild(b); return b;
  };
  for(const r of S.auto) mk("bar", r, null, null);
  for(const r of S.ann) mk("bar ann"+(r.id===S.sel?" sel":""), r, `${(r.end-r.start).toFixed(1)}s`, r.id);
  if (S.pending) mk("bar pend", {start:S.pending.start, end:Math.max(S.pending.end, v.currentTime)}, "标记中…", null);
  return g;
}

function renderList(){
  const list = $("#list"); list.innerHTML="";
  $("#nAuto").textContent = S.auto.length;
  $("#nAnn").textContent = S.ann.length;
  $("#tabAuto").className = S.tab==="auto"?"active":"";
  $("#tabAnn").className = S.tab==="ann"?"active":"";
  const rows = S.tab==="auto" ? S.auto : S.ann;
  if(!rows.length){ list.innerHTML=`<div class="empty">${S.tab==="auto"?"没有自动切分数据":"还没有标注，按 [ 开始"}</div>`; return; }
  rows.forEach((r,i)=>{
    const row=document.createElement("div"); row.className="row"+(r.id===S.sel?" sel":"");
    const tags = S.tab==="auto" ? `<div class="tags">${r.shots}拍 · ${r.score}分</div>` : `<div class="tags">${r.source==="auto"?"自动":"手动"}</div>`;
    row.innerHTML = `<div class="idx">${i+1}</div>
      <div class="times">${r.start.toFixed(2)} → ${r.end.toFixed(2)} <small>(${(r.end-r.start).toFixed(2)}s)</small>${tags}</div>
      <div>${S.tab==="ann"?'<button class="x" title="删除">✕</button>':''}</div>`;
    row.onclick = (e)=>{ if(e.target.classList.contains("x")){ pushUndo(); S.ann=S.ann.filter(x=>x.id!==r.id); if(S.sel===r.id)S.sel=null; markDirty(); renderAll(); return;} S.viewCenter=r.start; if(r.id){S.sel=r.id;} seek(r.start,true); renderAll(); };
    list.appendChild(row);
  });
}

function updateHud(){
  $("#hud").innerHTML = `<b>${fmt(v.currentTime)}</b> / ${fmt(S.duration)}`;
  const g = detailGeom();
  playhead.style.left = t2x(v.currentTime, g)+"px";
  // loop
  if (S.loop){ const r=selAnn(); if(r && v.currentTime > r.end) v.currentTime=r.start; }
  renderOverview();
}
function renderAll(){
  resizeCanvases();
  renderDetail(); renderList(); updateHud();
}

// ---------------------------------------------------------------- 时间轴交互
// 统一用 window 级监听器，避免「pointerdown 里重建 DOM -> setPointerCapture 失效」这类
// 疑难杂症；同时支持在时间轴空白处按住拖动来 scrub。
let drag = null;

function detailPos(e){ const r = track.getBoundingClientRect(); return { x:e.clientX-r.left, W:r.width||1 }; }
function overviewPos(e){ const r = ov.getBoundingClientRect(); return { x:e.clientX-r.left, W:r.width||1 }; }
function ensureUndo(){ if (drag && !drag.undo){ pushUndo(); drag.undo = true; } }

function onDragMove(e){
  if (!drag) return;
  if (drag.type === "scrub"){
    const p = drag.where === "overview" ? overviewPos(e) : detailPos(e);
    if (Math.abs(p.x - drag.x0) > 2) drag.moved = true;
    const t = clamp(drag.t0 + (p.x - drag.x0) / drag.W * drag.span, 0, S.duration);
    v.currentTime = t;
    if (drag.where === "overview"){ S.viewCenter = t; renderDetail(); }
    updateHud();
    return;
  }
  const g = detailGeom(); const p = detailPos(e);
  const dt = (p.x - drag.x0) / g.W * g.span;
  if (Math.abs(dt) > 1e-6){ ensureUndo(); drag.moved = true; }
  const r = findAnn(drag.id); if (!r) return;
  if (drag.type === "start") r.start = clamp(drag.s0 + dt, 0, r.end - 0.05);
  else if (drag.type === "end") r.end = clamp(drag.e0 + dt, r.start + 0.05, S.duration);
  else { const len = drag.e0 - drag.s0; const ns = clamp(drag.s0 + dt, 0, Math.max(0, S.duration - len)); r.start = ns; r.end = ns + len; }
  renderDetail(); updateHud();
}
function onDragUp(){
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved){ markDirty(); }
  renderAll();
}
window.addEventListener("pointermove", onDragMove);
window.addEventListener("pointerup", onDragUp);
window.addEventListener("pointercancel", onDragUp);

track.addEventListener("pointerdown",(e)=>{
  e.preventDefault();
  const g = detailGeom(); const p = detailPos(e);
  const bar = e.target.closest(".bar");
  if (bar && bar.classList.contains("ann")){
    const edge = e.target.dataset.edge;          // 先读，再重建 DOM
    const id = Number(bar.dataset.id);
    S.sel = id; renderAll();
    drag = { type: edge || "move", id, x0:p.x, s0:findAnn(id).start,
             e0:findAnn(id).end, moved:false, undo:false };
    return;
  }
  // 空白处按下并拖动 = 拖动时间轴 scrub（视图跟随播放头）
  const t = clamp(g.start + p.x / g.W * g.span, 0, S.duration);
  drag = { type:"scrub", where:"detail", x0:p.x, W:g.W, span:g.span, t0:g.start, moved:false };
  v.currentTime = t; S.viewCenter = t; updateHud();
});
ov.addEventListener("pointerdown",(e)=>{
  e.preventDefault();
  const p = overviewPos(e);
  drag = { type:"scrub", where:"overview", x0:p.x, W:p.W, span:S.duration||1, t0:0, moved:false };
  const t = clamp(p.x / p.W * (S.duration||1), 0, S.duration);
  v.currentTime = t; S.viewCenter = t; renderDetail(); updateHud();
});
track.addEventListener("wheel",(e)=>{ e.preventDefault(); S.viewSpan=clamp(S.viewSpan*(e.deltaY>0?1.2:0.83),2,Math.max(4,S.duration)); renderAll(); },{passive:false});

$("#bZoomIn").onclick=()=>{ S.viewSpan=clamp(S.viewSpan*0.7,2,Math.max(4,S.duration)); renderAll(); };
$("#bZoomOut").onclick=()=>{ S.viewSpan=clamp(S.viewSpan*1.4,2,Math.max(4,S.duration)); renderAll(); };
$("#bFocus").onclick=()=>{ const a=parseFloat($("#fStart").value)||0, b=parseFloat($("#fEnd").value)||0; if(b>a){ S.focus=[a,Math.min(b,S.duration)]; S.viewSpan=Math.max(4,S.focus[1]-S.focus[0]); seek(a); renderAll(); markDirty(); } };
$("#bAll").onclick=()=>{ S.focus=[0,S.duration]; S.viewSpan=Math.max(4,Math.min(120,S.duration)); $("#fStart").value=0; $("#fEnd").value=Math.round(S.duration); renderAll(); };
$("#bPrevSeg").onclick=()=>goSeg(-1);
$("#bNextSeg").onclick=()=>goSeg(1);

// ---------------------------------------------------------------- 快捷键
document.addEventListener("keydown",(e)=>{
  const tag = (e.target.tagName || "").toUpperCase();
  if (tag==="INPUT" || tag==="TEXTAREA" || e.target.isContentEditable) return;
  // 焦点还在某个按钮上时按 Space 会「再次点击该按钮」，先移开焦点。
  if (tag==="BUTTON" || tag==="A") e.target.blur();
  const k=e.key;
  const big = e.altKey?5:(e.shiftKey?0.1:1);
  if(k===" "){ e.preventDefault(); togglePlay(); }
  else if(k==="ArrowLeft"){ e.preventDefault(); step(-big); }
  else if(k==="ArrowRight"){ e.preventDefault(); step(big); }
  else if(k==="["||k==="i"||k==="I"){ newSeg(); }
  else if(k==="]"||k==="o"||k==="O"){ finishSeg(); }
  else if(k==="{"){ setSelStart(); }
  else if(k==="}"){ setSelEnd(); }
  else if(k==="c"||k==="C"){ acceptAuto(!e.shiftKey); }
  else if(k==="n"||k==="N"){ jumpAuto(1); }
  else if(k==="p"||k==="P"){ jumpAuto(-1); }
  else if(k==="PageDown"){ e.preventDefault(); goSeg(1); }
  else if(k==="PageUp"){ e.preventDefault(); goSeg(-1); }
  else if(k==="d"||k==="D"){ delSel(); }
  else if(k==="z"||k==="Z"){ undo(); }
  else if(k==="s"||k==="S"){ save(); }
  else if(k==="a"||k==="A"){ selectNearest(); }
  else if(k===","){ nudge(-0.1); }
  else if(k==="."){ nudge(0.1); }
  else if(k==="<"){ nudgeEnd(-0.1); }
  else if(k===">"){ nudgeEnd(0.1); }
  else if(k==="Escape"){ S.pending=null; S.sel=null; renderAll(); }
});

// ---------------------------------------------------------------- 绑定按钮
$("#bPlay").onclick=togglePlay;
$("#bBack1").onclick=()=>step(-1); $("#bFwd1").onclick=()=>step(1);
$("#bBack01").onclick=()=>step(-0.1); $("#bFwd01").onclick=()=>step(0.1);
$("#bIn").onclick=newSeg; $("#bOut").onclick=finishSeg;
$("#bAccept").onclick=()=>acceptAuto(true);
$("#bNextAuto").onclick=()=>jumpAuto(1); $("#bPrevAuto").onclick=()=>jumpAuto(-1);
$("#bDel").onclick=delSel; $("#bUndo").onclick=undo; $("#bClear").onclick=clearAll;
$("#bSeed").onclick=seedAll; $("#bSave").onclick=save; $("#bCsv").onclick=exportCsv;
$("#bLoop").onclick=()=>{ S.loop=!S.loop; $("#bLoop").className=S.loop?"on":""; };
$("#speed").oninput=(e)=>{ v.playbackRate=parseFloat(e.target.value); $("#speedVal").textContent=parseFloat(e.target.value).toFixed(1)+"x"; };
$("#tabAuto").onclick=()=>{ S.tab="auto"; renderList(); };
$("#tabAnn").onclick=()=>{ S.tab="ann"; renderList(); };
$("#fStart").onchange=$("#fEnd").onchange=()=>{};
v.addEventListener("play",()=>$("#bPlay").textContent="⏸ 暂停 (Space)");
v.addEventListener("pause",()=>$("#bPlay").textContent="▶ 播放 (Space)");
window.addEventListener("beforeunload",(e)=>{ if(S.dirty){ try{ navigator.sendBeacon("/api/save", new Blob([JSON.stringify({rallies:S.ann,focus:S.focus,note:S.note})],{type:"application/json"})); }catch(_){ } e.preventDefault(); e.returnValue=""; } });
window.addEventListener("resize",()=>renderAll());

function loopRAF(){ updateHud(); requestAnimationFrame(loopRAF); }

// ---------------------------------------------------------------- 初始化
async function init(){
  const info = await (await fetch("/api/info")).json();
  S.duration = (info.probe && info.probe.duration) || (info.autoMeta && info.autoMeta.duration) || 0;
  S.fps = (info.probe && info.probe.fps) || 0;
  S.auto = info.auto || [];
  S.ann = (info.annotations||[]).map(r=>({...r, id:nextId()}));
  S.focus = info.focus && info.focus[1] ? info.focus : [0, S.duration];
  S.note = info.note||"";
  S.viewCenter = 0; S.viewSpan = Math.max(10, Math.min(60, S.duration||30));
  $("#hMeta").textContent = `${info.videoName} · ${fmt(S.duration)} · ${S.fps.toFixed(2)}fps · 自动 ${S.auto.length} · 标注 ${S.ann.length}`;
  $("#fStart").value = Math.round(S.focus[0]); $("#fEnd").value = Math.round(S.focus[1]||S.duration);
  v.addEventListener("loadedmetadata", ()=>{ if(!S.duration) S.duration=v.duration; S.fps=S.fps||0; renderAll(); });
  setSave(S.ann.length? "已载入标注":"新建标注", "");
  renderAll(); loopRAF();
}
init().catch(e=>{ document.body.insertAdjacentHTML("beforeend",`<pre style="color:#f88;padding:16px">初始化失败: ${e}</pre>`); });
</script>
</body>
</html>
